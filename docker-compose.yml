# Tracera 1.0.0 — generated by publish CI. Do not edit by hand.

# Tracera on-prem stack — digest-pinned images.
#
#   docker login ghcr.io   # pull token from Tracera support — see INSTALL.md
#   docker compose --env-file .env up -d
#
# Profile: medium. From about 4 GB RAM per instance (see INSTALL.md).
# API loads customer settings from `.env` (env_file). `environment` below is only
# compose wiring, fail-fast required secrets, and medium-profile overrides.

name: tracera

services:
  postgres:
    image: postgres:18.6-alpine3.24
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "effective_cache_size=4GB",
        "-c",
        "work_mem=32MB",
        "-c",
        "maintenance_work_mem=256MB",
        "-c",
        "wal_buffers=64MB",
        "-c",
        "max_connections=150",
        "-c",
        "max_locks_per_transaction=256",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "effective_io_concurrency=200",
        "-c",
        "max_wal_size=2GB",
        "-c",
        "min_wal_size=256MB",
        "-c",
        "wal_compression=lz4",
        "-c",
        "checkpoint_timeout=15min",
        "-c",
        "jit=off",
        "-c",
        "idle_in_transaction_session_timeout=5min",
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tracera
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d tracera",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.0
    # Single-node S3-compatible store (no console). Durable writes (strict). Tuned for Tracera SNSD.
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${TRACERA_S3_ACCESS_KEY:-tracera}
      RUSTFS_SECRET_KEY: ${TRACERA_S3_SECRET_KEY:?set TRACERA_S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_REGION: us-east-1
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_BUFFER_PROFILE: WebWorkload
      RUSTFS_SCANNER_SPEED: slow
      RUSTFS_SCANNER_IDLE_MODE: "true"
      RUSTFS_SCANNER_START_DELAY_SECS: "300"
      RUSTFS_SCANNER_MAX_CONCURRENT_SET_SCANS: "1"
      RUSTFS_SCANNER_MAX_CONCURRENT_DISK_SCANS: "1"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    image: ghcr.io/tracera-dev/tracera-api@sha256:1280263f481d56c8cbbce008dc9080b2f95bca9d95751b3cb51a8bd3f0496396
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Compose network (always set here — do not put these in .env)
      TRACERA_DATABASE_URL: postgres://${POSTGRES_USER:-tracera}:${POSTGRES_PASSWORD}@postgres:5432/tracera
      TRACERA_HTTP_BIND: 0.0.0.0:8080
      TRACERA_S3_ENDPOINT: http://s3:9000
      # Fail-fast Required keys from .env (secrets, URL/CORS, SMTP host/from)
      TRACERA_ADMIN_EMAIL: ${TRACERA_ADMIN_EMAIL:?set TRACERA_ADMIN_EMAIL}
      TRACERA_ADMIN_PASSWORD: ${TRACERA_ADMIN_PASSWORD:?set TRACERA_ADMIN_PASSWORD}
      TRACERA_SECRETS_ENCRYPTION_KEY: ${TRACERA_SECRETS_ENCRYPTION_KEY:?set TRACERA_SECRETS_ENCRYPTION_KEY}
      TRACERA_PUBLIC_APP_URL: ${TRACERA_PUBLIC_APP_URL:?set TRACERA_PUBLIC_APP_URL}
      TRACERA_CORS_ORIGINS: ${TRACERA_CORS_ORIGINS:?set TRACERA_CORS_ORIGINS}
      TRACERA_S3_SECRET_KEY: ${TRACERA_S3_SECRET_KEY:?set TRACERA_S3_SECRET_KEY}
      TRACERA_MAIL_SMTP_HOST: ${TRACERA_MAIL_SMTP_HOST:?set TRACERA_MAIL_SMTP_HOST}
      TRACERA_MAIL_FROM_ADDRESS: ${TRACERA_MAIL_FROM_ADDRESS:?set TRACERA_MAIL_FROM_ADDRESS}
      # Medium-profile overrides
      TRACERA_COOKIE_SECURE: ${TRACERA_COOKIE_SECURE:-true}
      TRACERA_S3_ACCESS_KEY: ${TRACERA_S3_ACCESS_KEY:-tracera}
      TRACERA_S3_BUCKET: ${TRACERA_S3_BUCKET:-tracera}
      TRACERA_DB_POOL_MAX_SIZE: ${TRACERA_DB_POOL_MAX_SIZE:-40}
      TRACERA_HTTP_LONG_REQUEST_TIMEOUT_SECS: ${TRACERA_HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
      TRACERA_LICENSE_PATH: /license/tracera.license
    ports:
      - "${TRACERA_HOST_API_PORT:-8080}:8080"
    volumes:
      - ${TRACERA_LICENSE_HOST_PATH:-./tracera.license}:/license/tracera.license:ro

  ui:
    image: ghcr.io/tracera-dev/tracera-ui@sha256:e0af21b2193333b51c7a6db11cf4bbc28510b0e0863dff4210be900b2b35cfde
    depends_on:
      - api
    environment:
      TRACERA_API_UPSTREAM: api:8080
      TRACERA_HTTP_LONG_REQUEST_TIMEOUT_SECS: ${TRACERA_HTTP_LONG_REQUEST_TIMEOUT_SECS:-300}
    ports:
      - "${TRACERA_HOST_UI_PORT:-8088}:80"

volumes:
  pg_data:
  s3_data:
